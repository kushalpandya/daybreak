schema_version: 1

brief:
  timezone: America/New_York
  mail_lookback: 24h
  calendar_lookahead: 48h

filters:
  # Gmail category labels treated as noise. Defaults to [promotions, social].
  mail_ignore_categories:
    - promotions
    - social
  # Case-insensitive substrings matched against the sender name and address.
  mail_ignore_senders: []
  # Case-insensitive substrings matched against GitLab todo titles.
  todo_ignore_titles: []

weather:
  enabled: true
  name: New York
  latitude: 40.7128
  longitude: -74.0060
  units: metric

google:
  enabled: true
  include_declined: false
  accounts:
    - id: 1
      address: primary@example.com
      config_dir: ~/.config/daybreak/google/1
      max_messages: 500
    - id: 2
      address: secondary@example.com
      config_dir: ~/.config/daybreak/google/2
      max_messages: 500

github:
  enabled: true
  repositories:
    - owner/project
  lookback: 24h
  max_items: 100

gitlab:
  enabled: true
  host: gitlab.com
  projects:
    - group/project
  max_items_per_category: 100
  # Lookback for merged MRs and closed issues; omit to skip the recap.
  recap: 7d

telegram:
  enabled: false
  chat_id: 123456789
  disable_link_previews: true

state:
  database: ~/.local/share/daybreak/daybreak.db
